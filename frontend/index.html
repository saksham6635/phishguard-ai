<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f0f4f8" />
  <title>PhishGuard AI — Real-Time Anti-Vishing Voice Companion</title>
  <meta name="description" content="PhishGuard AI monitors your calls in real time, detecting voice phishing with AI-powered scam detection, risk scoring, and instant alerts." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon-shield.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Ambient Cybersecurity Background CSS -->
  <link rel="stylesheet" href="css/ambient-background.css" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React + ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
            mono:    ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg:          #f0f4f8;
      --bg-2:        #e8edf3;
      --surface:     #edf1f6;
      --card-bg:     #f0f4f8;
      --border:      rgba(180, 196, 214, 0.7);
      --border-focus:#2a7c6f;
      --shadow-out:  6px 6px 14px #c8d0da, -5px -5px 12px #ffffff;
      --shadow-in:   inset 4px 4px 9px #c8d0da, inset -4px -4px 9px #ffffff;
      --text:        #1e2a36;
      --muted:       #526474;
      --faint:       #7a8fa0;
      --accent:      #2a7c6f;
      --accent-lt:   #e6f4f2;
      --accent-2:    #3b6d8c;
      --safe-rgb:    31, 107, 73;
      --warn-rgb:    145, 91, 12;
      --crit-rgb:    164, 55, 50;
      --radius:      16px;
      --font:        'Inter', system-ui, sans-serif;
      --font-d:      'Space Grotesk', 'Inter', sans-serif;
      --font-mono:   'JetBrains Mono', ui-monospace, monospace;
      --ease:        cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: light; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Neomorphic Card ── */
    .neo {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-out);
    }
    .neo:hover { box-shadow: 8px 8px 18px #c0c9d4, -6px -6px 14px #ffffff; }

    /* ── Shimmer Border Card ── */
    .shimmer-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-out);
      overflow: hidden;
      transition: transform 0.3s var(--ease), box-shadow 0.3s;
    }
    .shimmer-card::before {
      content: '';
      position: absolute; inset: 0; border-radius: inherit; padding: 1.5px;
      background: linear-gradient(120deg, transparent 30%, rgba(42,124,111,0.3) 50%, transparent 70%);
      background-size: 200% 100%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: shimmer-move 3.5s linear infinite;
      pointer-events: none;
    }
    @keyframes shimmer-move {
      from { background-position: -200% 0; }
      to   { background-position: 200% 0; }
    }
    .shimmer-card:hover { transform: translateY(-3px); box-shadow: 8px 8px 22px #bac4d0, -6px -6px 16px #ffffff; }

    /* ── Top Navigation Bar ── */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(240, 244, 248, 0.88);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 14px rgba(45, 65, 85, 0.06);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .navbar.scrolled {
      background: rgba(236, 242, 248, 0.97);
      box-shadow: 0 4px 20px rgba(35, 55, 75, 0.09);
    }
    .nav-inner {
      max-width: 1360px; margin: 0 auto; padding: 0 28px; height: 68px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo {
      display: flex; align-items: center; gap: 11px; text-decoration: none;
      font-family: var(--font-d); font-weight: 700; font-size: 19px; color: var(--text);
    }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: var(--accent); box-shadow: 3px 3px 8px rgba(42,124,111,0.35), -2px -2px 6px rgba(255,255,255,0.7);
    }
    .logo-mark svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo span { color: var(--accent); }
    .logo em {
      font-style: normal; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.06em; padding: 2px 7px; border-radius: 6px;
      background: var(--accent-lt); color: var(--accent); border: 1px solid rgba(42,124,111,0.25);
      margin-left: 2px;
    }

    /* Primary Nav Links / Tabs */
    .nav-links {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 6px; border-radius: 12px;
      background: var(--surface);
      border: 1px solid rgba(180, 196, 214, 0.5);
      box-shadow: var(--shadow-in);
    }
    .nav-links a {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 9px; text-decoration: none;
      font-size: 13.5px; font-weight: 500; color: var(--muted);
      transition: all 0.22s var(--ease);
    }
    .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.6); }
    .nav-links a.active {
      color: var(--accent); background: var(--card-bg); font-weight: 600;
      box-shadow: 2px 2px 6px #c4cdd8, -2px -2px 6px #ffffff;
      border: 1px solid rgba(42, 124, 111, 0.2);
    }

    .nav-live-dot {
      display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px rgba(42,124,111,0.7);
      animation: navPulse 1.6s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes navPulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50%      { transform: scale(1.4); opacity: 0.4; }
    }

    /* Right side Status Widget */
    .nav-status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 99px;
      background: var(--card-bg); border: 1px solid var(--border);
      box-shadow: 2px 2px 6px #c8d0da, -2px -2px 6px #ffffff;
      font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
    }
    .nav-status-sep { color: var(--border); font-weight: 300; }

    /* Mobile hamburger */
    .nav-hamburger {
      display: none; width: 40px; height: 40px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow-out); align-items: center; justify-content: center; cursor: pointer;
    }
    .nav-hamburger svg { width: 20px; height: 20px; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
    .mobile-menu {
      display: none; position: fixed; top: 68px; left: 0; right: 0; z-index: 99;
      background: rgba(240, 244, 248, 0.98); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border); padding: 14px 24px 22px;
      flex-direction: column; gap: 6px; box-shadow: 0 10px 26px rgba(40,60,80,0.12);
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 10px;
      text-decoration: none; font-size: 14.5px; font-weight: 500; color: var(--muted);
    }
    .mobile-menu a.active { background: var(--accent-lt); color: var(--accent); font-weight: 600; }
    .mobile-menu a:hover { background: var(--surface); color: var(--text); }

    /* ── Animations ── */
    .reveal { opacity: 0; transform: translateY(32px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
    .reveal.in { opacity: 1; transform: translateY(0); }

    @keyframes bar-wave {
      0%, 100% { height: 4px; opacity: 0.5; }
      25%      { height: 26px; opacity: 1; }
      50%      { height: 40px; opacity: 1; }
      75%      { height: 18px; opacity: 0.8; }
    }
    .sbar {
      width: 5px; border-radius: 10px; transform-origin: bottom;
      background: linear-gradient(to top, var(--accent), #3b8fbf);
    }

    @keyframes float-y {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    @keyframes ring-out {
      0%   { transform: scale(1); opacity: 0.55; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes scan {
      0%   { top: 10%; }
      100% { top: 90%; }
    }
    @keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes badge-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes grad-shift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

    .grad-text-anim {
      background: linear-gradient(135deg, #2a7c6f 0%, #3b6d8c 40%, #5b4fa8 70%, #2a7c6f 100%);
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: grad-shift 5s ease infinite;
    }

    section { position: relative; z-index: 1; }
    .section-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 99px; font-family: var(--font-mono);
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      background: var(--accent-lt); color: var(--accent); border: 1px solid rgba(42,124,111,0.22);
      margin-bottom: 20px;
    }

    /* Scenario pill active states */
    .scenario-btn {
      padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600;
      border: 1px solid var(--border); background: var(--card-bg); color: var(--muted);
      cursor: pointer; transition: all 0.25s var(--ease);
      box-shadow: 3px 3px 8px #c8d0da, -2px -2px 6px #ffffff;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .scenario-btn:hover { color: var(--text); transform: translateY(-1px); }
    .scenario-btn.active {
      color: var(--accent); background: var(--card-bg);
      border-color: rgba(42, 124, 111, 0.4);
      box-shadow: inset 3px 3px 6px #c8d0da, inset -3px -3px 6px #ffffff;
    }

    /* Modal */
    .modal-bg {
      position: fixed; inset: 0; z-index: 200; background: rgba(30,42,54,0.45);
      backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-box {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
      box-shadow: var(--shadow-out); max-width: 640px; width: 100%; max-height: 80vh;
      overflow-y: auto; padding: 36px; position: relative;
    }
    .modal-box::-webkit-scrollbar { width: 6px; }
    .modal-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    @media (max-width: 980px) {
      .nav-links, .nav-status-pill { display: none; }
      .nav-hamburger { display: flex; }
    }
    @media (max-width: 640px) {
      .nav-inner { padding-inline: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
</head>
<body>

  <!-- ============ CYBERSECURITY BACKGROUND ============ -->
  <div class="telemetry-strip" aria-hidden="true"></div>
  <canvas id="ambient-dots-canvas" aria-hidden="true"></canvas>

  <div class="hud-corner tl" aria-hidden="true">
    <span class="hud-crosshair"></span>SYS.VOICE // 48kHz REAL-TIME ASR

  <div class="hud-corner tr" aria-hidden="true">
    DETECTOR // MULTI-LAYER NLP &lt;180MS<span class="hud-crosshair"></span>
  </div>
  <div class="hud-corner bl" aria-hidden="true">

  </div>
  <div class="hud-corner br" aria-hidden="true">
    STATUS: ARMED // ZERO SERVER RETENTION<span class="hud-crosshair"></span>
  </div>

  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ─────────── Icons ─────────── */
const Icon = ({ d, d2, rect, line, path2, cx, cy, r, viewBox='0 0 24 24', size='1em', stroke='currentColor', sw=2 }) => (
  <svg viewBox={viewBox} fill="none" stroke={stroke} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{width:size,height:size,flexShrink:0}}>
    {d    && <path d={d}/>}
    {d2   && <path d={d2}/>}
    {path2&& <path d={path2}/>}
    {rect && <rect {...rect}/>}
    {line && <line {...line}/>}
    {r!==undefined && cx!==undefined && <circle cx={cx} cy={cy} r={r}/>}
  </svg>
);

const ShieldIcon = ({size}) => <Icon size={size} d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" d2="m9 12 2 2 4-4"/>;
const MicIcon    = ({size}) => <Icon size={size} d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" d2="M19 10v2a7 7 0 0 1-14 0v-2" line={{x1:12,x2:12,y1:19,y2:22}}/>;
const BoltIcon   = ({size}) => <Icon size={size} d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>;
const AlertIcon  = ({size}) => <Icon size={size} d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" d2="M12 9v4" path2="M12 17h.01"/>;
const BookIcon   = ({size}) => <Icon size={size} d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" d2="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>;
const CheckIcon  = ({size}) => <Icon size={size} d="M20 6 9 17l-5-5" sw={2.5}/>;
const PhoneIcon  = ({size}) => <Icon size={size} d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.21 12 19.79 19.79 0 0 1 1.14 3.4 2 2 0 0 1 3.11 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>;
const MailIcon   = ({size}) => <Icon size={size} d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" rect={{width:20,height:16,x:2,y:4,rx:2}}/>;
const GlobeIcon  = ({size}) => <Icon size={size} cx={12} cy={12} r={10} d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" d2="M2 12h20"/>;
const ChartIcon  = ({size}) => <Icon size={size} line={{x1:18,x2:18,y1:20,y2:10}} d="M6 20V14" d2="M12 20V4"/>;

/* ─────────── Soundwave Visualizer ─────────── */
function Visualizer({ activeRisk = 0, isSimulating = false }) {
  const bars = 22;
  const delays = Array.from({length:bars}, (_,i) => (i * 0.07 % 0.9).toFixed(2));
  const durations = [1.1,1.4,1.0,1.6,1.2,1.5,1.3,1.1,1.4,1.2,1.0,1.5,1.3,1.1,1.6,1.4,1.0,1.2,1.5,1.3,1.1,1.4];

  const ringColor = activeRisk > 70 ? 'rgba(164, 55, 50, 0.4)' : activeRisk > 40 ? 'rgba(145, 91, 12, 0.4)' : 'rgba(42, 124, 111, 0.2)';
  const orbAccent = activeRisk > 70 ? '#a43732' : activeRisk > 40 ? '#8a570a' : 'var(--accent)';

  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:0}}>
      {/* Outer rings */}
      <div style={{position:'relative',width:220,height:220,display:'flex',alignItems:'center',justifyContent:'center'}}>
        {[0,1,2].map(i => (
          <div key={i} style={{
            position:'absolute', borderRadius:'50%',
            width: 180+i*34, height: 180+i*34,
            border:`1.5px solid ${ringColor}`,
            animation:`ring-out ${2.4+i*0.8}s ease-out ${i*0.6}s infinite`,
          }}/>
        ))}
        {/* Rotating dashed ring */}
        <div style={{position:'absolute',width:198,height:198,animation:'rot 24s linear infinite'}}>
          <svg width="198" height="198" viewBox="0 0 198 198">
            <circle cx="99" cy="99" r="94" fill="none" stroke={ringColor} strokeWidth="1.5" strokeDasharray="7 5"/>
          </svg>
        </div>
        {/* Main orb */}
        <div style={{
          width:148, height:148, borderRadius:'50%',
          background:'linear-gradient(135deg, #e6f4f2 0%, #f0f4f8 60%)',
          boxShadow:'6px 6px 18px #c4d0dc, -6px -6px 16px #ffffff, inset 0 0 0 1px rgba(42,124,111,0.15)',
          display:'flex', alignItems:'center', justifyContent:'center',
          position:'relative', overflow:'hidden',
          border:`1px solid ${ringColor}`,
          transition:'border-color 0.4s ease',
        }}>
          {/* Scan line */}
          <div style={{
            position:'absolute', left:0, right:0, height:2,
            background:`linear-gradient(90deg, transparent, ${orbAccent}, transparent)`,
            animation:'scan 2.6s linear infinite', top:'50%',
          }}/>
          <div style={{fontSize:40,color:orbAccent,filter:`drop-shadow(0 2px 8px ${orbAccent}40)`,transition:'color 0.4s ease'}}>
            <MicIcon size="1em"/>
          </div>
          {/* LIVE badge */}
          <div style={{
            position:'absolute', top:12, right:12,
            display:'inline-flex', alignItems:'center', gap:4,
            padding:'2px 8px', borderRadius:99, fontSize:10,
            fontFamily:'var(--font-mono)', fontWeight:700, letterSpacing:'0.1em',
            background: activeRisk > 70 ? 'rgba(164,55,50,0.12)' : 'rgba(42,124,111,0.12)',
            color: orbAccent,
            border:`1px solid ${orbAccent}40`,
          }}>
            <span style={{width:6,height:6,borderRadius:'50%',background:orbAccent,display:'inline-block',animation:'badge-blink 1.2s ease-in-out infinite'}}/>
            {isSimulating ? 'ANALYZING' : 'READY'}
          </div>
        </div>
      </div>
      {/* Waveform bars */}
      <div style={{display:'flex',alignItems:'flex-end',gap:3,height:44,marginTop:16}}>
        {Array.from({length:bars}).map((_,i) => (
          <div
            key={i}
            className="sbar"
            style={{
              width:5, height:4,
              animation:`bar-wave ${durations[i]}s ${delays[i]}s ease-in-out infinite`,
              background: activeRisk > 70
                ? 'linear-gradient(to top, #a43732, #f87171)'
                : activeRisk > 40
                ? 'linear-gradient(to top, #8a570a, #facc15)'
                : 'linear-gradient(to top, var(--accent), #3b8fbf)',
            }}
          />
        ))}
      </div>
      <p style={{marginTop:10,fontFamily:'var(--font-mono)',fontSize:11,color:orbAccent,letterSpacing:'0.16em',textTransform:'uppercase',opacity:0.9,fontWeight:600}}>
        {activeRisk > 70 ? '🚨 HIGH THREAT DETECTED' : activeRisk > 40 ? '⚠️ SUSPICIOUS PATTERN' : 'CONTINUOUS SPEECH MONITOR'}
      </p>
    </div>
  );
}

/* ─────────── useReveal ─────────── */
function useReveal(threshold=0.15) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current; if(!el) return;
    const obs = new IntersectionObserver(([e]) => { if(e.isIntersecting){ setVis(true); obs.disconnect(); } }, {threshold});
    obs.observe(el);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, vis];
}

/* ─────────── StatCard ─────────── */
function StatCard({value, label, accent}) {
  return (
    <div className="neo" style={{padding:'18px 14px',textAlign:'center',transition:'all 0.3s'}}>
      <div style={{fontFamily:'var(--font-d)',fontSize:'1.7rem',fontWeight:700,color:accent||'var(--accent)',lineHeight:1.1}}>
        {value}
      </div>
      <div style={{marginTop:4,fontSize:12,color:'var(--faint)',fontWeight:500,letterSpacing:'0.02em'}}>{label}</div>
    </div>
  );
}

/* ─────────── Unified Navigation Bar ─────────── */
function Navbar() {
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 24);
    window.addEventListener('scroll', fn, {passive:true});
    return () => window.removeEventListener('scroll', fn);
  }, []);
